services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glamride}
      POSTGRES_USER: ${POSTGRES_USER:-glamride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glamride}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - glamride_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glamride_postgres_data:
